<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Golf</title>
<style>
body{font-family:sans-serif;background:#1b4d3d;color:#fff;padding:20px;text-align:center}
.card{background:#fcf9f0;color:#1b4d3d;border-radius:20px;padding:30px;max-width:500px;margin:20px auto;cursor:pointer}
.term{font-size:2rem;font-weight:bold}
.pron{color:#8a7a55;font-family:monospace;margin:10px 0}
.meaning{background:#fff5d2;padding:15px;border-radius:15px;font-size:1.2rem;margin-top:10px;display:none}
.hint{color:#b0a78b;font-size:.9rem;margin-top:10px}
button{padding:12px 24px;margin:6px;border:none;border-radius:30px;font-size:1rem;font-weight:bold;cursor:pointer}
#rBtn{background:#58b368}
#fBtn{background:#e68a6e}
#reBtn{background:#e0cfa4}
</style>
</head>
<body>
<h1>⛳ GOLF Flashcards</h1>
<div>เหลือ <span id="r">40</span> | จำได้ <span id="m">0</span> | จำไม่ได้ <span id="f">0</span></div>
<div id="box"></div>
<button id="fBtn">😵 จำไม่ได้</button>
<button id="rBtn">😎 จำได้</button>
<button id="reBtn">🔄 รีเซ็ท</button>
<script>
var terms=[
{t:"ADDRESS",p:"/əˈdres/",m:"ตำแหน่งที่ผู้เล่นยืนก่อนตีลูกออกไป"},
{t:"AMATEUR",p:"/ˈæmətər/",m:"ผู้เล่นกอล์ฟเชิงกีฬา ไม่ใช่อาชีพ"},
{t:"APPROACH",p:"/əˈproʊtʃ/",m:"การตีลูกขึ้นกรีน หรือบริเวณหน้าธุริน"},
{t:"BACKSPIN",p:"/ˈbækspɪn/",m:"การตีให้ลูกหมุนถอยหลัง เพื่อให้ลูกตกและหยุดวิ่งโดยเร็ว"},
{t:"BIRDIE",p:"/ˈbɜːrdi/",m:"การทำแต้มน้อยกว่าที่หลุมกำหนด 1 แต้ม"},
{t:"BOGEY",p:"/ˈboʊɡi/",m:"การทำแต้มมากกว่าที่หลุมกำหนด 1 แต้ม"},
{t:"BUNKER",p:"/ˈbʌŋkər/",m:"บ่อทราย หรือหลุมทราย"},
{t:"CADDIE",p:"/ˈkædi/",m:"ใครก็ได้ที่แบกถุงกอล์ฟให้ บางครั้งให้คำแนะนำด้วย"},
{t:"CASUAL WATER",p:"/ˈkæʒuəl ˈwɔːtər/",m:"น้ำที่ไหลมารวมกันในบางขณะ ที่ไม่ใช่เป็นบ่อ หรือแอ่งน้ำที่ทำไว้เป็นอุปสรรค"},
{t:"CHIP SHOT",p:"/tʃɪp ʃɑːt/",m:"การตีลูกสั้นข้างกรีนให้ไปใกล้หลุม"},
{t:"DIVOT",p:"/ˈdɪvət/",m:"รอยที่เกิดจากหน้าไม้ที่ตีลูกลึกลงไปในดิน ทำให้แซะหน้าชิ้นมาด้วย"},
{t:"DOGLEG",p:"/ˈdɔːɡleɡ/",m:"หลุมที่มีแนวเลี้ยวไปทางซ้ายหรือขวา"},
{t:"DOUBLE BOGEY",p:"/ˈdʌbəl ˈboʊɡi/",m:"การทำแต้มมากกว่าที่หลุมกำหนด 2 แต้ม"},
{t:"DRAW",p:"/drɔː/",m:"ลูกที่ตีแล้วโค้งไปทางซ้ายแต่น้อยกว่า HOOK"},
{t:"DRIVE",p:"/draɪv/",m:"การตีครั้งแรกโดยธรรมดาที่จากหมุดไม้ จากแท่นออก (TEE OFF)"},
{t:"DRIVER",p:"/ˈdraɪvər/",m:"ไม้กอล์ฟที่ตีได้ไกลที่สุดในชุด ใช้ตีลูกจากแท่นออก (TEE OFF) ในหลุมที่มีระยะไกล"},
{t:"EAGLE",p:"/ˈiːɡəl/",m:"การทำแต้มต่ำกว่าที่หลุมกำหนด 2 แต้ม"},
{t:"FAIRWAY",p:"/ˈferweɪ/",m:"สนามหญ้าระหว่างแท่นออกกับกรีน"},
{t:"FORE",p:"/fɔːr/",m:"คำร้องเตือนให้ทุกคนระวังอันตรายที่เกิดจากการตีลูก"},
{t:"GROSS",p:"/ɡroʊs/",m:"แต้มที่ตีจริงต่อรอบหรือตลอดการแข่งขันของนักกอล์ฟ"},
{t:"HAZARD",p:"/ˈhæzərd/",m:"หลุมทรายที่สร้างขึ้น"},
{t:"HOOK",p:"/hʊk/",m:"การตีลูกที่เลี้ยวซ้ายมากๆ"},
{t:"IRONS",p:"/ˈaɪərnz/",m:"ไม้กอล์ฟที่มีหัวเป็นเหล็ก (ยกเว้นไม้พัตเตอร์)"},
{t:"LIE",p:"/laɪ/",m:"ตำแหน่งของลูกบนสนามหรือกรีน"},
{t:"MATCH PLAY",p:"/mætʃ pleɪ/",m:"การแข่งขันโดยถือจำนวนหลุมเป็นเครื่องกำหนด ผู้ชนะคือผู้ที่ชนะหลุมมากกว่า"},
{t:"NET",p:"/net/",m:"แต้มรวมครั้งสุดท้ายได้จากการหักแต้มต่อออกแล้ว"},
{t:"OUT OF BOUNDS",p:"/aʊt əv baʊndz/",m:"พื้นที่นอกเขตที่กำหนดในสนามกอล์ฟ"},
{t:"PAR",p:"/pɑːr/",m:"การทำแต้มได้เท่ากับแต้มที่หลุมกำหนด"},
{t:"PITCH SHOT",p:"/pɪtʃ ʃɑːt/",m:"การตีลูกด้วยไม้ที่หน้าไม้เอียงมากๆ เพื่อให้ลูกหยุดเร็วบนกรีน"},
{t:"PUNCH SHOT",p:"/pʌntʃ ʃɑːt/",m:"การตีให้ลูกกอล์ฟพุ่งต่ำกว่าปกติ"},
{t:"PUTT",p:"/pʌt/",m:"การตีเบาๆ ให้ลูกกลิ้งบนพื้นเพื่อให้ลงหลุม"},
{t:"PUTTER",p:"/ˈpʌtər/",m:"ไม้กอล์ฟที่ใช้สำหรับตีลูกบนกรีน"},
{t:"ROUGH",p:"/rʌf/",m:"พื้นที่ที่ไม่มีการดูแลรักษา ไม่ใช่ส่วนของพื้นที่เล่น"},
{t:"SHANK",p:"/ʃæŋk/",m:"ตีถูกลอยของหัวไม้ทำให้ลูกวิ่งเลียดไปทางขวา"},
{t:"SLICE",p:"/slaɪs/",m:"การตีลูกหมุนตามเข็มนาฬิกา ทำให้ลูกเลี้ยวเป็นวงไปทางขวา"},
{t:"STROKE PLAY",p:"/stroʊk pleɪ/",m:"การแข่งขันโดยถือจำนวนครั้งที่ตีเป็นเครื่องกำหนดผู้แพ้หรือชนะ"},
{t:"TEE",p:"/tiː/",m:"หมุดที่ปักแล้วเอาลูกวางบนหมุดเพื่อตีในครั้งแรกในหลุมหนึ่งๆ"},
{t:"TEE OFF",p:"/tiː ɔːf/",m:"การตีครั้งแรกในหลุมหนึ่งๆ โดยธรรมดาจะตีด้วยไม้ DRIVER"},
{t:"TOP",p:"/tɑːp/",m:"การตีถูกลูกที่ส่วนบนสุดของลูก"},
{t:"WOODS",p:"/wʊdz/",m:"ไม้กอล์ฟที่ก้านยาวๆ สำหรับตีลูกจากแท่นออก หรือบนพื้นที่การเล่นเพื่อให้ได้ระยะไกล"}
];

var deck=[],mem=[],fg=0,cur=null,flip=false;
var box=document.getElementById('box');
var rBtn=document.getElementById('rBtn');
var fBtn=document.getElementById('fBtn');
var reBtn=document.getElementById('reBtn');

function sh(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function up(){document.getElementById('r').textContent=deck.length;document.getElementById('m').textContent=mem.length;document.getElementById('f').textContent=fg}
function render(){
  if(deck.length===0){
    box.innerHTML='<div class="card"><div class="term">🎉 ครบ 40 คำแล้ว!</div><div class="hint">กดรีเซ็ทเพื่อเริ่มใหม่</div></div>';
    rBtn.disabled=true;fBtn.disabled=true;up();return;
  }
  cur=deck[0];flip=false;
  box.innerHTML='<div class="card" id="c"><div class="term">'+cur.t+'</div><div class="pron">'+cur.p+'</div><div class="meaning" id="mm">'+cur.m+'</div><div class="hint" id="hh">👆 คลิกเพื่อดูความหมาย</div></div>';
  document.getElementById('c').onclick=function(){
    var mm=document.getElementById('mm'),hh=document.getElementById('hh');
    if(!flip){mm.style.display='block';hh.style.display='none';flip=true}
    else{mm.style.display='none';hh.style.display='block';flip=false}
  };
  rBtn.disabled=false;fBtn.disabled=false;up();
}
rBtn.onclick=function(){if(deck.length===0)return;mem.push(deck.shift());render()};
fBtn.onclick=function(){if(deck.length===0)return;deck.push(deck.shift());fg++;render()};
reBtn.onclick=function(){deck=sh(terms.slice());mem=[];fg=0;render()};

deck=sh(terms.slice());
render();
</script>
</body>
</html>
